<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art - Astrophysics Portfolio</title>
    <meta name="description" content="Pencil art and other work outside the lab.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <style>
        .art-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.9rem;
        }

        .art-tile {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 10px 24px -16px rgba(0, 0, 0, 0.75);
        }

        .art-button {
            appearance: none;
            border: 0;
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
            background: transparent;
        }

        .art-button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .art-button img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 220ms ease, filter 220ms ease;
        }

        .art-button:hover img,
        .art-button:focus-visible img {
            transform: scale(1.03);
            filter: brightness(1.06);
        }

        .art-modal[hidden] {
            display: none;
        }

        .art-modal {
            position: fixed;
            inset: 0;
            z-index: 1200;
            display: grid;
            place-items: center;
            padding: clamp(1rem, 3vw, 2rem);
        }

        .art-modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(5, 8, 14, 0.72);
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
        }

        .art-modal-dialog {
            position: relative;
            z-index: 1;
            width: min(100%, 980px);
            max-height: min(92vh, 920px);
            display: grid;
            grid-template-rows: auto auto;
            gap: 0.8rem;
            justify-items: center;
        }

        .art-modal-figure {
            margin: 0;
            width: 100%;
            max-height: calc(min(92vh, 920px) - 70px);
            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
            gap: 0.65rem;
            justify-items: center;
        }

        .art-modal-image-wrap {
            width: 100%;
            max-height: 100%;
            display: grid;
            place-items: center;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 60px -28px rgba(0, 0, 0, 0.9);
        }

        .art-modal-image {
            display: block;
            max-width: 100%;
            max-height: calc(92vh - 180px);
            width: auto;
            height: auto;
            object-fit: contain;
            background: #05070a;
        }

        .art-modal-caption {
            margin: 0;
            text-align: center;
            color: var(--text);
            font-size: 0.95rem;
            line-height: 1.5;
            opacity: 0.95;
            max-width: 82ch;
        }

        .art-modal-close,
        .art-modal-nav {
            position: absolute;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(17, 22, 30, 0.82);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
        }

        .art-modal-close:hover,
        .art-modal-close:focus-visible,
        .art-modal-nav:hover,
        .art-modal-nav:focus-visible {
            background: rgba(var(--accent-rgb), 0.16);
            border-color: var(--accent);
            outline: none;
            transform: translateY(-1px);
        }

        .art-modal-close {
            top: 0.35rem;
            right: 0.35rem;
        }

        .art-modal-nav.prev {
            left: 0.35rem;
            top: 50%;
            transform: translateY(-50%);
        }

        .art-modal-nav.next {
            right: 0.35rem;
            top: 50%;
            transform: translateY(-50%);
        }

        .art-modal-nav.prev:hover,
        .art-modal-nav.prev:focus-visible,
        .art-modal-nav.next:hover,
        .art-modal-nav.next:focus-visible {
            transform: translateY(-50%) scale(1.02);
        }

        body.modal-open {
            overflow: hidden;
        }

        @media (max-width: 640px) {
            .art-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .art-modal {
                padding: 0.8rem;
            }

            .art-modal-image {
                max-height: calc(92vh - 210px);
            }

            .art-modal-close,
            .art-modal-nav {
                width: 38px;
                height: 38px;
            }

            .art-modal-nav.prev {
                left: 0.2rem;
            }

            .art-modal-nav.next {
                right: 0.2rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .art-button img,
            .art-modal-close,
            .art-modal-nav {
                transition: none;
            }
        }
    </style>
</head>
<body>

    <div class="art-modal" data-art-modal hidden>
        <div class="art-modal-backdrop" data-art-close></div>
        <div class="art-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="art-modal-caption">
            <button class="art-modal-close" type="button" aria-label="Close image viewer" data-art-close>&times;</button>
            <button class="art-modal-nav prev" type="button" aria-label="Previous image" data-art-prev>&#8592;</button>
            <button class="art-modal-nav next" type="button" aria-label="Next image" data-art-next>&#8594;</button>

            <figure class="art-modal-figure">
                <div class="art-modal-image-wrap">
                    <img class="art-modal-image" src="" alt="">
                </div>
                <figcaption class="art-modal-caption" id="art-modal-caption"></figcaption>
            </figure>
        </div>
    </div>

    <script>
        (() => {
            const buttons = [...document.querySelectorAll('.art-button')];
            const modal = document.querySelector('[data-art-modal]');
            const modalImage = modal?.querySelector('.art-modal-image');
            const modalCaption = modal?.querySelector('.art-modal-caption');
            const closeButtons = [...document.querySelectorAll('[data-art-close]')];
            const prevButton = document.querySelector('[data-art-prev]');
            const nextButton = document.querySelector('[data-art-next]');

            if (!buttons.length || !modal || !modalImage || !modalCaption) return;

            const items = buttons.map((button) => {
                const img = button.querySelector('img');
                return {
                    src: img?.getAttribute('src') || '',
                    alt: img?.getAttribute('alt') || '',
                    caption: button.dataset.caption || img?.getAttribute('alt') || ''
                };
            });

            let current = 0;
            let lastFocused = null;

            const render = (index) => {
                current = (index + items.length) % items.length;
                const item = items[current];
                modalImage.src = item.src;
                modalImage.alt = item.alt;
                modalCaption.textContent = item.caption;
            };

            const openModal = (index, trigger) => {
                lastFocused = trigger || document.activeElement;
                render(index);
                modal.hidden = false;
                document.body.classList.add('modal-open');
                nextButton?.focus();
            };

            const closeModal = () => {
                modal.hidden = true;
                document.body.classList.remove('modal-open');
                if (lastFocused && typeof lastFocused.focus === 'function') {
                    lastFocused.focus();
                }
            };

            buttons.forEach((button, idx) => {
                button.addEventListener('click', () => openModal(idx, button));
            });

            closeButtons.forEach((btn) => btn.addEventListener('click', closeModal));
            prevButton?.addEventListener('click', () => render(current - 1));
            nextButton?.addEventListener('click', () => render(current + 1));

            document.addEventListener('keydown', (event) => {
                if (modal.hidden) return;
                if (event.key === 'Escape') closeModal();
                if (event.key === 'ArrowLeft') render(current - 1);
                if (event.key === 'ArrowRight') render(current + 1);
            });
        })();
    </script>
